name: nopalia

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nopalia
      POSTGRES_PASSWORD: nopalia  # local only
      POSTGRES_DB: nopalia
    ports:
      - "5433:5432"  # 5433 on the host so it doesn't clash with a local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nopalia -d nopalia"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    environment:
      NOPALIA_DATABASE_URL: postgresql+psycopg://nopalia:nopalia@db:5432/nopalia
      NOPALIA_ENVIRONMENT: local
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # Live reload for local dev: source is bind-mounted over the image copy.
    volumes:
      - ./api/src:/app/src:ro
    command: >
      sh -c "alembic upgrade head &&
             uvicorn nopalia_api.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/src"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
