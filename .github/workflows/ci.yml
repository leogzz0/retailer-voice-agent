name: ci

on:
  push:
    branches: [main]
  pull_request:

# Never calls ElevenLabs: agent tests consume plan quota and run manually (see docs/03-runbook.md).
jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nopalia
          POSTGRES_PASSWORD: nopalia
          POSTGRES_DB: nopalia_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nopalia" --health-interval 2s --health-timeout 3s
          --health-retries 20
    env:
      NOPALIA_TEST_DATABASE_URL: postgresql+psycopg://nopalia:nopalia@localhost:5432/nopalia_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t nopalia-api:ci ./api
